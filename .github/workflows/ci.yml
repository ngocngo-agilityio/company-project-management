name: CI

on:
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required check on dev and main. Keep the job name exactly `ci`.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Builds Storybook (a compile check; the a11y test runs from the story sources, not the build)
  # and fails on any accessibility violation, in light and dark.
  build-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @board/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @board/ui build-storybook
      - run: pnpm --filter @board/ui test:a11y

  # Browser tests (Playwright). Mocked specs run at 360, 768 and 1024 px; specs tagged @real run against
  # the real backend and a throwaway Postgres. Keep the name `e2e`; add it to the required checks of
  # `dev` and `main` in the repository ruleset once it has been stable for a few runs.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: board
          POSTGRES_PASSWORD: board_ci
          POSTGRES_DB: board_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U board -d board_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://board:board_ci@127.0.0.1:5432/board_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @board/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Browsers come from the cache; the system libraries they need are not cached, so always install those.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @board/web exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @board/web exec playwright install-deps chromium

      - run: pnpm e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
