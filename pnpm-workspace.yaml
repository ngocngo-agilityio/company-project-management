packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true

# Single source of truth for dependency versions. Packages use "catalog:".
catalog:
  # tooling
  typescript: 6.0.3
  eslint: 10.15.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.73.0
  eslint-plugin-react-hooks: 7.1.1
  eslint-config-prettier: 10.1.8
  prettier: 3.10.1
  globals: 17.14.0
  husky: 9.1.7
  lint-staged: 17.6.1
  turbo: 2.11.13
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  vitest: 5.1.1
  tsx: 4.23.15
  "@types/node": 26.6.6
  # web
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.8
  "@vitejs/plugin-react": 6.3.0
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5
  "@radix-ui/react-dialog": 1.3.1
  "@tanstack/react-query": 5.108.1
  jsdom: 31.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/jest-dom": 8.0.0
  # shared
  zod: 4.6.7
  # backend
  fastify: 5.12.8
  "@fastify/cors": 11.4.3
  prisma: 7.10.1
  "@prisma/client": 7.10.1

minimumReleaseAgeExclude:
  - "@tanstack/query-core@5.108.1"
  - "@tanstack/react-query@5.108.1"
